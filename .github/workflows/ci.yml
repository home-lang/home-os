name: HomeOS CI

# MASTER_PLAN §12 Tier 1 — the job names ARE the phase gates.
#
# The ratchet rule: a gate is added when its phase is worked, and once it is
# green on main it is never removed. Gates accumulate into a permanent
# regression wall. Nothing here is allowed to pass by skipping: a missing
# tool, a missing compiler, or a missing artifact is a red build.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  # Every HomeOS commit builds against one pinned Home compiler revision
  # (MASTER_PLAN §6, compiler-interface contract). Bump deliberately.
  HOME_COMPILER_REPO: https://github.com/home-lang/home
  HOME_COMPILER_REF: c1818b32ac776b35ccb31a27cedd3400ffbbac12
  ZIG_VERSION: 0.17.0-dev.1441+d5181a9c9

jobs:
  # ---------------------------------------------------------------------------
  # Shared: build the pinned Home compiler once, reuse it in every gate.
  # ---------------------------------------------------------------------------
  home-compiler:
    name: home-compiler
    runs-on: ubuntu-latest
    steps:
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Check out the pinned Home compiler
        run: |
          git clone "$HOME_COMPILER_REPO" home-compiler
          cd home-compiler
          # No fallback to main: an unresolvable pin is a red build, not a
          # silently different compiler (MASTER_PLAN §6 pinning policy).
          git checkout "$HOME_COMPILER_REF"
          git rev-parse HEAD > ../home-compiler-rev.txt

      - name: Build
        run: cd home-compiler && zig build -Doptimize=ReleaseSafe

      - name: Upload compiler
        uses: actions/upload-artifact@v4
        with:
          name: home-compiler
          path: |
            home-compiler/zig-out/bin/home
            home-compiler-rev.txt
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Gate: parse-rate — every kernel .home file must parse (A1, #23)
  # ---------------------------------------------------------------------------
  parse-rate:
    name: parse-rate
    runs-on: ubuntu-latest
    needs: home-compiler
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: home-compiler
          path: compiler

      - name: Parse-rate gate (must be 100%)
        run: |
          chmod +x compiler/zig-out/bin/home
          HOME_COMPILER="$PWD/compiler/zig-out/bin/home" ./scripts/parse-rate.sh --strict

  # ---------------------------------------------------------------------------
  # Ratchet: mvk-compiles — how many Appendix A files reach codegen (#38).
  # Not a pass/fail gate on absolute progress; a floor that may never fall.
  # ---------------------------------------------------------------------------
  mvk-compiles:
    name: mvk-compiles
    runs-on: ubuntu-latest
    needs: home-compiler
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: home-compiler
          path: compiler

      - name: Codegen ratchet
        run: |
          chmod +x compiler/zig-out/bin/home
          HOME_COMPILER="$PWD/compiler/zig-out/bin/home" ./scripts/mvk-compiles.sh --list

  # ---------------------------------------------------------------------------
  # Ratchet: typecheck — milestone A2. How many Appendix A files have zero
  # type errors. A separate axis from mvk-compiles: that asks whether the
  # backend can lower a file, this asks whether the file typechecks.
  # ---------------------------------------------------------------------------
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    needs: home-compiler
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: home-compiler
          path: compiler

      - name: Typecheck ratchet
        run: |
          chmod +x compiler/zig-out/bin/home
          HOME_COMPILER="$PWD/compiler/zig-out/bin/home" ./scripts/typecheck.sh --list

  # ---------------------------------------------------------------------------
  # Ratchet: mvk-links — the whole Appendix A set linked into one image. This
  # is the Phase 0 exit gate, and it asks what per-file compilation cannot:
  # duplicate symbols, references to functions nobody wrote, section conflicts.
  # ---------------------------------------------------------------------------
  mvk-links:
    name: mvk-links
    runs-on: ubuntu-latest
    needs: home-compiler
    steps:
      - uses: actions/checkout@v6

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: home-compiler
          path: compiler

      - name: Link ratchet
        run: |
          chmod +x compiler/zig-out/bin/home
          HOME_COMPILER="$PWD/compiler/zig-out/bin/home" ./scripts/mvk-links.sh --list

  # ---------------------------------------------------------------------------
  # Gate: boot-to-shell (MASTER_PLAN Phase 1 exit gate)
  #
  # The linked image must boot, reach the end of init, unpack an initramfs,
  # answer scripted commands on the serial console, run a userspace binary at
  # ring 3 through real syscalls, and show both IRQ lines firing.
  # ---------------------------------------------------------------------------
  boot:
    name: boot-to-shell
    runs-on: ubuntu-latest
    needs: home-compiler
    steps:
      - uses: actions/checkout@v6

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86

      - uses: actions/download-artifact@v4
        with:
          name: home-compiler
          path: compiler

      - name: Boot ratchet
        run: |
          chmod +x compiler/zig-out/bin/home
          HOME_COMPILER="$PWD/compiler/zig-out/bin/home" BOOT_TIMEOUT=90 \
            ./scripts/boot-gate.sh --verbose

  # ---------------------------------------------------------------------------
  # Ratchet: mvk-compiles-aarch64 — how many Appendix A files reach ARM64
  # codegen. Kept as its own number rather than folded into the x86 one,
  # because the two advance independently: a file can lower on one target and
  # not the other, and a combined figure would hide that.
  # ---------------------------------------------------------------------------
  mvk-compiles-aarch64:
    name: mvk-compiles-aarch64
    runs-on: ubuntu-latest
    needs: home-compiler
    steps:
      - uses: actions/checkout@v6

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: home-compiler
          path: compiler

      - name: Codegen ratchet (aarch64)
        run: |
          chmod +x compiler/zig-out/bin/home
          HOME_COMPILER="$PWD/compiler/zig-out/bin/home" \
            ./scripts/mvk-compiles.sh --arch=aarch64 --list

  # ---------------------------------------------------------------------------
  # Gate: boot-qemu-aarch64 — a Home-compiled ARM64 kernel boots and prints on
  # the serial console.
  #
  # This runs on QEMU's `virt` machine. QEMU has no Raspberry Pi 5 model, so
  # this proves the compiler, the frame layout, the MMIO path and the boot
  # handoff; the Pi's own peripherals are proven by the hardware gate (#63)
  # and this job must never be described as testing a Pi.
  # ---------------------------------------------------------------------------
  boot-qemu-aarch64:
    name: boot-qemu-aarch64
    runs-on: ubuntu-latest
    needs: home-compiler
    steps:
      - uses: actions/checkout@v6

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm

      - uses: actions/download-artifact@v4
        with:
          name: home-compiler
          path: compiler

      - name: ARM64 boot ratchet
        run: |
          chmod +x compiler/zig-out/bin/home
          HOME_COMPILER="$PWD/compiler/zig-out/bin/home" BOOT_TIMEOUT=60 \
            ./scripts/boot-gate-aarch64.sh

  # ---------------------------------------------------------------------------
  # Gate: stub-register — every // STUB marker must be registered (§7 rule 3)
  # ---------------------------------------------------------------------------
  stub-register:
    name: stub-register
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for unregistered STUB markers
        run: ./scripts/stub-check.sh

  # ---------------------------------------------------------------------------
  # Gate: boot-qemu-x86_64 — the Phase 0 exit gate (#26).
  # Compiles the MVK with the Home compiler, links it, boots it in QEMU, and
  # asserts the proof-of-life string on the serial console.
  # ---------------------------------------------------------------------------
  boot-qemu-x86_64:
    name: boot-qemu-x86_64
    runs-on: ubuntu-latest
    needs: home-compiler
    steps:
      - uses: actions/checkout@v6

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install QEMU
        # pantry.jsonc pins qemu.org for local development; CI uses
        # the distro package because it is an order of magnitude faster to
        # provision and this gate runs on every commit.
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86

      - uses: actions/download-artifact@v4
        with:
          name: home-compiler
          path: compiler

      - name: Build the Minimum Viable Kernel
        run: |
          chmod +x compiler/zig-out/bin/home
          HOME_COMPILER="$PWD/compiler/zig-out/bin/home" ./scripts/build.sh mvk

      - name: Boot it and assert proof-of-life on serial
        run: ./scripts/boot-test.sh

      - name: Upload kernel + serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvk-x86_64
          path: |
            kernel/build/home-kernel.elf
            kernel/build/home-kernel.bin
            kernel/build/boot-test.log
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Housekeeping: shell scripts must at least parse.
  # ---------------------------------------------------------------------------
  shellcheck:
    name: shell-syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: bash -n every script
        run: |
          rc=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "SYNTAX ERROR: $f"; rc=1; }
          done < <(find scripts static-checks -name '*.sh')
          exit $rc
